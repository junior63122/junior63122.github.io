<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Le Journal de Junior</title>
  <meta name="description" content="Le Journal de Junior, quotidien niçois : business, finance, événementiel, tech, monde, sport et l'actualité de Junior Joyant.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="journal.css">

<body>

    <span id="edition"></span>

      <button type="button" data-lang="en">EN</button>
    </div>
  </div>
  <header class="masthead">
