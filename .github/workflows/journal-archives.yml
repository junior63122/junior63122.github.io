name: Journal - archives

# Lancement manuel uniquement : onglet Actions → « Journal - archives » → Run workflow.
on:
  workflow_dispatch:
    inputs:
      de:
        description: "Début de la période (AAAA-MM-JJ)"
        default: "2024-01-01"
      a:
        description: "Fin de la période (AAAA-MM-JJ)"
        default: "2026-10-31"
      nombre:
        description: "Nombre d'articles à écrire (50 maximum conseillé par lancement)"
        default: "50"

permissions:
  contents: write

concurrency:
  group: journal
  cancel-in-progress: false

jobs:
  archives:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Rédaction des archives
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/write-archives.mjs --de="${{ github.event.inputs.de }}" --a="${{ github.event.inputs.a }}" --nombre="${{ github.event.inputs.nombre }}"
      - name: Publier
        if: always()
        run: |
          git config user.name "journal-bot"
          git config user.email "journal-bot@users.noreply.github.com"
          git add journal/articles.json
          git diff --cached --quiet && echo "Rien de nouveau" && exit 0
          git commit -m "Journal : archives du ${{ github.event.inputs.de }} au ${{ github.event.inputs.a }}"
          git pull --rebase
          git push
