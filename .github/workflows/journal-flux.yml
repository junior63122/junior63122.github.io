name: Journal - vérification des flux

# Lancement manuel : teste les flux RSS des médias locaux et affiche le résultat dans le journal d'exécution.
on:
  workflow_dispatch:
    inputs:
      flux:
        description: "Flux à tester (séparés par des espaces) ; vide = liste par défaut"
        default: ""
      detail:
        description: "Afficher toutes les infos de chaque flux (oui/non)"
        default: "non"

jobs:
  flux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check-feeds.mjs $FLUX
        env:
          FLUX: ${{ github.event.inputs.flux }}
          DUMP: ${{ github.event.inputs.detail == 'oui' && '1' || '' }}
