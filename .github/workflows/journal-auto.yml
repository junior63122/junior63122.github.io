name: Journal - éditions

on:
  schedule:
    - cron: "17 5 * * *"  # vers 6h/7h (heure de Paris) : édition du matin
    - cron: "17 16 * * *" # vers 17h/18h : mise à jour de l'actu
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: journal
  cancel-in-progress: false

jobs:
  generer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Photos libres de droits (Wikimedia Commons)
        run: node scripts/fetch-images.mjs
      - name: Actualité (Business, Finance, Événementiel, Tech, Monde, Nice, Sport)
        run: node scripts/generate-news.mjs
      - name: Rédaction des articles
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/write-articles.mjs
      - name: Publier
        run: |
          git config user.name "journal-bot"
          git config user.email "journal-bot@users.noreply.github.com"
          git add journal/articles.json journal/img/stock
          git diff --cached --quiet && echo "Rien de nouveau" && exit 0
          git commit -m "Journal : édition du $(date -u +%F)"
          git pull --rebase
          git push
