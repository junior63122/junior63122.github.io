name: Journal - article automatique

on:
  schedule:
    - cron: "17 6 * * *" # tous les jours vers 7h/8h (heure de Paris)
  workflow_dispatch:
    inputs:
      nombre:
        description: "Nombre d'articles à générer"
        default: "1"

permissions:
  contents: write

jobs:
  generer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Générer le(s) article(s)
        run: node scripts/generate-article.mjs "${{ github.event.inputs.nombre || '1' }}"
      - name: Publier
        run: |
          git config user.name "journal-bot"
          git config user.email "journal-bot@users.noreply.github.com"
          git add journal/articles.json
          git diff --cached --quiet && echo "Rien de nouveau" && exit 0
          git commit -m "Journal : nouvel article du $(date -u +%F)"
          git push
